# Netlify Configuration for TrendWala Tools (tools.trendwala.in)

[build]
  publish = "dist"
  command = "node build.js"

# Explicit 200 pass-through for sitemap and robots before any fallback
[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

[[redirects]]
  from = "/sitemap"
  to = "/sitemap.xml"
  status = 301

[[redirects]]
  from = "/compress"
  to = "/compress/image/"
  status = 301

[[redirects]]
  from = "/resize"
  to = "/resize/image/"
  status = 301

[[redirects]]
  from = "/crop"
  to = "/crop/image/"
  status = 301

[[redirects]]
  from = "/rotate"
  to = "/rotate/image/"
  status = 301

# Fallback for 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Specific XML Content-Type and Caching Headers for sitemap.xml
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    X-Content-Type-Options = "nosniff"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=0, must-revalidate"

# Specific Plaintext Headers for robots.txt
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=0, must-revalidate"

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
